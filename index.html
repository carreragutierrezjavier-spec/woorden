<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1525" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Woorden">
<meta name="description" content="Woorden: neerlandés para hispanohablantes, 10 minutos al día.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css?v=402">
<title>Woorden</title>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-l">
      <div class="lvlrow"><span class="lvl" id="lvlName">Toerist</span><span class="lvlnum" id="lvlNum">Nivel 1</span></div>
      <div class="xpbar"><i id="xpFill"></i></div>
    </div>
    <span class="pill streak off" id="streak" title="Días seguidos cumpliendo el objetivo"><span id="flame"></span><b id="streakN">0</b></span>
    <button class="pill coins" id="coins" type="button" title="Stroopwafels: tu moneda"><span id="coinIc"></span><b id="coinN">0</b></button>
  </header>

  <main>
    <section class="tab" id="tab-home"></section>
    <section class="tab" id="tab-practice" hidden></section>
    <section class="tab" id="tab-dict" hidden></section>
    <section class="tab" id="tab-me" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button type="button" id="nav-home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M12 8.2l3.8 3.8-3.8 3.8-3.8-3.8z"/></svg><span>Hoy</span></button>
    <button type="button" id="nav-practice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8.5-11H12.5z"/></svg><span>Practicar</span></button>
    <button type="button" id="nav-dict"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h9.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h9.5M9 8.5h5"/></svg><span>Palabras</span></button>
    <button type="button" id="nav-me"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Yo</span></button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-h"><button class="back" id="sheetBack" type="button" aria-label="Volver">←</button><h2 id="sheetTitle"></h2></div>
  <div class="sheet-b" id="sheetBody"></div>
</div>

<div class="play" id="play" hidden>
  <div class="ptop">
    <button class="iconbtn" id="quit" type="button" aria-label="Salir de la partida">✕</button>
    <div class="prail" id="prail"><i id="pbarFill"></i></div>
    <span class="combo" id="combo" hidden></span>
  </div>
  <div class="pmeta"><span id="pTitle"></span><span id="pCount"></span><span id="pXp">+0 XP</span></div>
  <div class="powers" id="powers" hidden></div>
  <div class="stage" id="stage"></div>
  <div class="fb" id="fb" hidden></div>
</div>

<div class="end" id="end" hidden></div>
<div class="modal" id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="js/data-base.js?v=402"></script>
<script src="js/data-more.js?v=402"></script>
<script src="js/data-grammar.js?v=402"></script>
<script src="js/data-build.js?v=402"></script>
<script src="js/core.js?v=402"></script>
<script src="js/game.js?v=402"></script>
<script src="js/play.js?v=402"></script>
<script src="js/ui.js?v=402"></script>
</body>
</html>
